services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: edumanage-backend
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "${DB_CONNECTION_STRING}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: edumanage-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend